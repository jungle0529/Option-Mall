<!DOCTYPE html>
<html lang="ko">
<head>

<title>더샵 송도그란테르 G5 · 옵션몰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{ --topbar:62px; --accent:#2B3340; --bar:#1B2430; --ink:#1B2430; --sub:#727A86;
    --mut:#9098A2; --line:#E2DED7; --cardline:#EBE7E1; --bg:#F7F5F1; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
    background:var(--bg);color:#2A323D;font-size:14px;line-height:1.5}
  .hidden{display:none!important}
  @keyframes livedot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  ::selection{background:#cfe0ee}
  input::placeholder{color:#b4bac2}
  button{font-family:inherit}

  /* header */
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:0 28px;height:var(--topbar);
    background:rgba(255,255,255,.88);backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid #ECE9E3}
  .topbar .ci{height:28px;width:auto;display:block}
  .topbar .divider{width:1px;height:22px;background:#E2DED7;display:inline-block}
  .topbar .proj{font-weight:800;font-size:15px;letter-spacing:-.02em;color:#1E2733;white-space:nowrap}
  .topbar .projsub{font-size:12px;color:#9098A2;letter-spacing:.04em;white-space:nowrap}
  .topbar .spacer{flex:1}
  .topbar .unitchip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#3A424D;background:#F1EFEA;padding:7px 13px;border-radius:9px;white-space:nowrap;font-weight:600}
  .topbar .unitchip b{color:#1B2430;font-weight:800}
  .topbar .phone{display:inline-flex;align-items:center;gap:7px;font-size:19px;color:#1B2430;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
  .topbar .back{border:1px solid #E2DED7;background:#fff;color:#3A424D;padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
  .topbar .back:hover{background:#f3f1ec}

  /* landing */
  .heroband{position:relative;overflow:hidden;background:linear-gradient(115deg,#CFE0EE 0%,#E9DCE4 42%,#E1D9EC 68%,#F3ECDF 100%)}
  .heroband .sheen{position:absolute;top:-30%;right:-5%;width:46%;height:170%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));transform:rotate(18deg);filter:blur(6px)}
  .heroinner{position:relative;max-width:1080px;margin:0 auto;padding:74px 28px 96px;text-align:center}
  .eyebrow{font-size:11px;letter-spacing:.34em;color:#5B6675;font-weight:700;margin-bottom:20px}
  .heroinner h1{font-size:40px;line-height:1.25;margin:0 0 16px;font-weight:800;letter-spacing:-.03em;color:#1B2430}
  .heroinner p{margin:0 auto;font-size:15.5px;color:#4A5462;line-height:1.7;max-width:480px}
  .lookwrap{max-width:560px;margin:-52px auto 0;padding:0 22px;position:relative;z-index:2}
  .lookcard{background:#fff;border:1px solid var(--cardline);border-radius:18px;box-shadow:0 18px 50px rgba(28,36,48,.10);padding:30px 30px 28px}
  .lookcard label{font-weight:800;font-size:13px;color:#1E2733;letter-spacing:-.01em}
  .lookrow{display:flex;gap:9px;margin-top:11px}
  .lookrow input{flex:1;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;letter-spacing:.04em;color:#1E2733;outline:none}
  .lookrow input:focus{border-color:var(--accent)}
  .lookrow .go{background:var(--accent);color:#fff;border:none;padding:0 24px;border-radius:11px;font-weight:800;cursor:pointer;font-size:14px}
  .demohint{font-size:12px;color:var(--sub);margin-top:13px}
  .demohint code{background:#F1EFEA;padding:3px 8px;border-radius:6px;cursor:pointer;color:#2B3340;font-weight:700;margin-right:4px}
  .demohint code:hover{background:#2b3340;color:#fff}
  .lookerr{color:#B23B54;font-size:12.5px;margin-top:11px}
  .result{margin-top:20px;padding:20px 22px;border:1px solid var(--cardline);border-left:3px solid var(--accent);border-radius:13px;background:#FBFAF8}
  .result .who{font-size:12px;color:var(--mut)}
  .result .uu{font-size:22px;font-weight:800;margin:5px 0 2px;color:#1B2430;letter-spacing:-.02em}
  .result .rty{margin-top:7px;font-size:14px;color:#2A323D;font-weight:700;display:inline-flex;align-items:center;gap:8px}
  .result .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
  .result .badge.vr{background:var(--accent);color:#fff}
  .result .badge.thumb{background:#EEF1F4;color:#52606D}
  .result .plabel{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px}
  .result .enter{width:100%;background:var(--accent);color:#fff;border:none;padding:15px;border-radius:12px;font-weight:800;cursor:pointer;font-size:14.5px;margin-top:18px;letter-spacing:-.01em}
  .guidewrap{max-width:560px;margin:30px auto 84px;padding:0 22px}
  .guidecard{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid var(--cardline);border-radius:16px;padding:20px 24px;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,45,.05);transition:.14s}
  .guidecard:hover{border-color:#CFD4DC;box-shadow:0 10px 28px rgba(20,30,45,.09);transform:translateY(-2px)}
  .guidecard .gi{width:44px;height:44px;border-radius:12px;background:#EEF1F4;display:flex;align-items:center;justify-content:center;flex:none}
  .guidecard .gt{font-weight:800;font-size:15.5px;color:#1B2430;letter-spacing:-.02em}
  .guidecard .gd{font-size:12.5px;color:var(--sub);margin-top:3px}
  .guidecard .gbtn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;padding:11px 17px;border-radius:10px;white-space:nowrap}

  /* image slot placeholder */
  .imgslot{display:flex;align-items:center;justify-content:center;text-align:center;background:#F1EFEA;border:1.5px dashed #D7D2C8;color:#9aa0a8;font-size:12px;border-radius:12px}

  /* options */
  .optlayout{display:flex;align-items:flex-start}
  .optlayout.thumb{display:block}
  .vrstage{flex:1.1;position:sticky;top:var(--topbar);height:calc(100vh - var(--topbar));background:#0E2233;overflow:hidden}
  .vrstage iframe{width:100%;height:100%;border:0;display:block}
  .vrtag{position:absolute;top:18px;left:18px;pointer-events:none;display:flex;align-items:center;gap:7px;background:rgba(14,28,44,.5);backdrop-filter:blur(6px);color:#fff;font-size:11.5px;font-weight:700;padding:7px 13px;border-radius:30px;letter-spacing:.04em}
  .vrtag .dot{width:7px;height:7px;border-radius:50%;background:#7FE0A8;display:inline-block;animation:livedot 1.8s ease-in-out infinite}
  .optcol{padding:26px 30px 130px}
  .optlayout.vr .optcol{flex:1;max-width:640px}
  .optlayout.thumb .optcol{max-width:860px;margin:0 auto}
  .opttitle{font-size:21px;font-weight:800;margin:2px 2px 5px;color:#1B2430;letter-spacing:-.02em}
  .optdesc{color:var(--sub);font-size:13.5px;margin:0 2px 16px;line-height:1.6}
  .laytabs{display:inline-flex;gap:3px;background:#ECE9E3;border-radius:10px;padding:4px;margin:0 0 22px}
  .laytabs button{border:none;cursor:pointer;font-size:12.5px;font-weight:700;padding:7px 15px;border-radius:8px;background:transparent;color:#8A929C}
  .laytabs button.on{background:#fff;color:#1B2430;box-shadow:0 1px 3px rgba(20,30,45,.12)}

  .optgroup{margin-bottom:30px}
  .ghead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 2px 4px}
  .ghead .gname{font-size:16.5px;font-weight:800;color:#1B2430;letter-spacing:-.02em}
  .ghead .gtag{font-size:10.5px;font-weight:700;color:#2B3340;background:#EEF1F4;padding:3px 9px;border-radius:6px;letter-spacing:.02em}
  .ghead .gpick{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent);padding:3px 9px;border-radius:6px}
  .gnote{font-size:12.5px;color:var(--sub);margin:0 2px 12px;line-height:1.55}
  .glock{font-size:12.5px;color:#9A6B2E;background:#FBF3E7;border:1px solid #F0E0C6;border-radius:12px;padding:13px 15px}

  /* item cards */
  .items.list,.items.compact{display:flex;flex-direction:column;gap:10px}
  .items.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
  .chk{border-radius:7px;border:2px solid #C7CDD5;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
  .rowcard{display:flex;align-items:flex-start;gap:13px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.12s}
  .rowcard.compact{border-radius:11px;padding:11px 16px}
  .rowcard.sel{background:#F1F3F6;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .rowcard .chk{width:23px;height:23px;font-size:13px;margin-top:1px}
  .rowcard.compact .chk{width:20px;height:20px;margin-top:0}
  .rowcard.sel .chk{background:var(--accent);border-color:var(--accent)}
  .rowcard .nm{font-weight:800;font-size:15px;color:#1B2430;letter-spacing:-.01em}
  .rowcard.compact .nm{font-size:14px}
  .rowcard .free{font-size:10.5px;font-weight:700;color:#3C7A5E;background:#E7F0EA;padding:2px 8px;border-radius:6px}
  .rowcard .ds{font-size:12.5px;color:var(--sub);margin-top:7px;line-height:1.55}
  .rowcard .pr{font-weight:800;font-size:15px;color:var(--accent);white-space:nowrap;text-align:right;margin-top:1px}
  .rowcard .pr.zero{font-size:13px;color:var(--mut)}
  .nmrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

  .galcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,45,.05);transition:.12s}
  .galcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .galtile{position:relative;height:92px;background:linear-gradient(125deg,#CFE0EE,#E9DCE4 55%,#E1D9EC);display:flex;align-items:flex-end;padding:12px 14px}
  .galtile .tl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(27,36,48,.62)}
  .galtile .chk{position:absolute;top:10px;right:10px;width:22px;height:22px;font-size:12px;border-color:rgba(255,255,255,.85);background:rgba(255,255,255,.5)}
  .galcard.sel .galtile .chk{background:var(--accent);border-color:var(--accent)}
  .galbody{padding:14px 16px 16px}
  .galbody .gnm{font-weight:800;font-size:14px;color:#1B2430;letter-spacing:-.01em;line-height:1.35}
  .galbody .gpr{font-weight:800;font-size:13.5px;color:var(--accent);white-space:nowrap}
  .galbody .gpr.zero{font-size:12px;color:var(--mut)}
  .galbody .gds{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
  .galbody .baseline{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

  .widecard{display:flex;align-items:flex-start;gap:13px;background:#fff;border:1.5px dashed #CDD3DB;border-radius:14px;padding:15px 18px;cursor:pointer;margin-bottom:10px}
  .widecard.on{background:#F1F3F6;border-color:var(--accent)}
  .widecard .chk{width:23px;height:23px;font-size:13px;margin-top:1px}
  .widecard.on .chk{background:var(--accent);border-color:var(--accent)}

  .brandrow{display:flex;gap:9px;margin-top:9px}
  .brandrow .b{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:13px;text-align:center;cursor:pointer;background:#fff;transition:.12s}
  .brandrow .b.on{background:#F1F3F6;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .brandrow .b .bl{font-weight:800;font-size:14px;color:#1B2430}
  .brandrow .b .bp{font-weight:600;font-size:12px;color:var(--sub);margin-top:3px}

  .estbar{position:fixed;left:0;right:0;bottom:0;background:rgba(27,34,46,.97);backdrop-filter:blur(8px);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:15px 28px;z-index:40;border-top:1px solid rgba(255,255,255,.08)}
  .estbar .cnt{font-size:12px;color:#9DAAB8}
  .estbar .amt{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .estbar .amt small{font-size:12px;color:#9DAAB8;font-weight:500;margin-left:7px}
  .estbar .cta{background:#fff;color:#1B2430;border:none;padding:14px 26px;border-radius:11px;font-weight:800;cursor:pointer;font-size:14.5px;transition:.12s}
  .estbar .cta:hover{filter:brightness(.96)}

  /* modal */
  .ovl{position:fixed;inset:0;background:rgba(21,28,24,.46);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:20px;width:min(480px,94vw);box-shadow:0 30px 80px rgba(15,24,36,.4);overflow:hidden}
  .modal.lg{width:min(680px,95vw);max-height:92vh;overflow:auto;border-radius:22px}
  .mh{padding:19px 22px;border-bottom:1px solid #EDEAE4;display:flex;justify-content:space-between;align-items:center}
  .mh b{font-size:17px;color:#1B2430;letter-spacing:-.02em}
  .mh .x{cursor:pointer;color:var(--mut);font-size:13px}
  .mc{padding:8px 22px;max-height:54vh;overflow:auto}
  .qrow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed #EDEAE4;font-size:13px}
  .qrow span{color:var(--sub)} .qrow b{color:#1B2430}
  .qnote{font-size:11px;color:var(--mut);margin:14px 0;line-height:1.65}
  .mf{padding:17px 22px;border-top:1px solid #EDEAE4;display:flex;justify-content:space-between;align-items:center}
  .mf b:last-child{font-size:21px;color:var(--accent);letter-spacing:-.02em}
  .gtabs{display:flex;margin:22px 30px 0;border-bottom:1px solid var(--cardline)}
  .gtabs button{flex:1;justify-content:center;display:flex;align-items:center;gap:7px;border:none;background:transparent;cursor:pointer;font-size:14px;font-weight:700;color:#9098A2;padding:13px 4px;margin-bottom:-1px;border-bottom:2px solid transparent}
  .gtabs button.on{font-weight:800;color:var(--accent);border-bottom-color:var(--accent)}

  @media(max-width:760px){
    .optlayout{display:block} .vrstage{position:static;height:300px;width:100%}
    .optlayout.vr .optcol,.optlayout.thumb .optcol{max-width:none}
    .topbar{padding:0 16px;gap:10px} .topbar .phone{font-size:15px}
  }
</style>
</head>

/* ===================== ACTIONS ===================== */
function lookup(code){
  code=(code||'').trim();
  const u=UNITS[code];
  if(u){ S.result={code,unit:u,preview:false}; render(); return; }
  const m=code.toUpperCase().replace(/\s/g,'').match(/^G5-(.+)$/);
  if(m){ const t=m[1].toUpperCase(); if(TYPES[t]){
    S.result={code:'G5-'+t,unit:{block:BLOCK_OF[TYPES[t].set].split(' ')[0],dong:'–',ho:'–',type:t,name:'타입 미리보기'},preview:true}; render(); return; } }
  S.result={err:true}; render();
}
function openType(type,unit,code){ const T=TYPES[type]; Object.assign(S,{view:'options',type,unit,code,set:T.set,fam:T.fam,mode:T.mode,sel:{},fp:{wide:false},result:null}); window.scrollTo(0,0); render(); }
function backToLanding(){ S.view='landing'; render(); }

/* ===================== RENDER: LANDING ===================== */
function landingHTML(){
  let h=`<div class="heroband"><div class="sheen"></div><div class="heroinner">
    <div class="eyebrow">THE ENDLESS SYMBOL OF SONGDO</div>
    <h1>나의 집, 옵션을 직접 고르다</h1>
    <p>분양 고유번호를 입력하시면 배정된 동·호수의<br>옵션 선택 화면이 열립니다.</p></div></div>
    <div class="lookwrap"><div class="lookcard">
      <label for="codeInput">분양 고유번호</label>
      <div class="lookrow">
        <input id="codeInput" autocomplete="off" placeholder="예: G5-202401 또는 G5-84A" value="${S.result&&S.result.code?S.result.code:''}">
        <button class="go" data-act="lookup">조회</button>
      </div>`;
  if(S.result&&S.result.err) h+=`<div class="lookerr">해당 번호의 분양 정보를 찾을 수 없습니다. 번호를 확인해 주세요.</div>`;
  if(S.result&&S.result.unit){ const u=S.result.unit, vr=TYPES[u.type].mode==='vr', pv=S.result.preview;
    h+=`<div class="result">
      <div class="who">${pv?'타입 미리보기 · '+S.result.code:u.name+' 님 · '+S.result.code}</div>
      <div class="uu">${pv?u.type+' 타입':u.block+' '+u.dong+'동 '+u.ho+'호'}</div>
      <div class="rty"><b>${pv?u.block+' 구역':u.type+' 타입'}</b><span class="badge ${vr?'vr':'thumb'}">${vr?'VR 360':'썸네일'}</span></div>
      <div class="plabel">평면도</div>
      <img class="planimg" src="assets/plan-sample.png" alt="${u.type} 평면도" onerror="planFallback(this)" style="width:100%;aspect-ratio:4/3;object-fit:contain;border:1px solid #EBE7E1;border-radius:12px;background:#fff;display:block">
      <button class="enter" data-act="enter" data-type="${u.type}">옵션 선택 시작 →</button>
    </div>`;
  }
  h+=`</div></div>
    <div class="guidewrap"><div class="guidecard" data-act="guide-open">
      <div style="display:flex;align-items:center;gap:14px;min-width:0">
        <div class="gi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B3340" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></div>
        <div><div class="gt">옵션 계약 가이드</div><div class="gd">옵션 선택·계약 전, 이미지·영상 가이드를 확인하세요.</div></div>
      </div>
      <span class="gbtn">가이드 보기 →</span>
    </div></div>`;
  return h;
}

/* ===================== RENDER: OPTIONS ===================== */
function itemCardHTML(g,it){
  const sel=S.sel[g.id]===it.id, v=priceOf(it), free=(it.id==='no'), zero=v<=0;
  const priceText=zero?'포함':'+'+won(v)+'원';
  const desc=it.desc||'';
  if(S.layout==='gallery'){
    return `<div class="galcard ${sel?'sel':''}" data-act="select" data-group="${g.id}" data-id="${it.id}">
      <div class="galtile"><span class="tl">${g.name}</span><div class="chk">${sel?'✓':''}</div></div>
      <div class="galbody"><div class="baseline"><span class="gnm">${it.label}</span><span class="gpr ${zero?'zero':''}">${priceText}</span></div>
        ${free?'<span class="free" style="display:inline-block;margin-top:8px">기본 제공</span>':''}
        ${desc?`<div class="gds">${desc}</div>`:''}</div></div>`;
  }
  const compact=S.layout==='compact';
  return `<div class="rowcard ${compact?'compact':''} ${sel?'sel':''}" data-act="select" data-group="${g.id}" data-id="${it.id}">
    <div class="chk">${sel?'✓':''}</div>
    <div style="flex:1;min-width:0"><div class="nmrow"><span class="nm">${it.label}</span>${free?'<span class="free">기본 제공</span>':''}</div>
      ${(!compact&&desc)?`<div class="ds">${desc}</div>`:''}</div>
    <span class="pr ${zero?'zero':''}">${priceText}</span></div>`;
}
function groupHTML(g){
  const enabled=groupEnabled(g);
  const selItem=g.items.find(i=>i.id===S.sel[g.id]);
  const pick=(selItem && S.sel[g.id]!=='no' && enabled)?selItem.label:null;
  let h=`<div class="optgroup" data-anchor="${g.name}"><div class="ghead"><span class="gname">${g.name}</span>
    <span class="gtag">${g.brand?'브랜드 택1':'단일 선택'}</span>${pick?`<span class="gpick">선택: ${pick}</span>`:''}</div>`;
  if(g.note) h+=`<p class="gnote">${g.note}</p>`;
  if(!enabled) return h+`<div class="glock">🔒 시스템에어컨 [고급형(전실)] 선택 시 활성화됩니다.</div></div>`;
  if(g.items.some(i=>i.fp==='wide' && i.fpP && i.fpP[S.fam]!=null)){ const on=S.fp.wide;
    h+=`<div class="widecard ${on?'on':''}" data-act="wide"><div class="chk">${on?'✓':''}</div>
      <div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span class="nm">평면옵션 · 와이드리빙</span><span class="pr ${on?'':'zero'}">${on?'적용':'미적용'}</span></div>
        <div class="ds">거실 확장형 평면. 선택 시 거실·조명·시스템에어컨 옵션의 구성·가격이 변경됩니다.</div></div></div>`;
  }
  if(g.brand){
    h+=`<div class="items ${S.layout}">`+itemCardHTML(g,g.items.find(i=>i.id==='no'))+`</div>`;
    h+=`<div class="brandrow">`+g.items.filter(i=>i.id!=='no').map(it=>{ const on=S.sel[g.id]===it.id;
      return `<div class="b ${on?'on':''}" data-act="select" data-group="${g.id}" data-id="${it.id}"><div class="bl">${it.label}</div><div class="bp">+${won(it.price)}원</div></div>`;
    }).join('')+`</div>`;
  } else {
    h+=`<div class="items ${S.layout}">`+g.items.map(it=>itemCardHTML(g,it)).join('')+`</div>`;
  }
  if(S.mode!=='vr') h+=`<div style="margin-top:14px"><div class="imgslot" style="width:100%;aspect-ratio:16/10">선택한 옵션의 이미지 영역</div></div>`;
  return h+`</div>`;
}
function optionsHTML(){
  const vr=S.mode==='vr';
  let h=`<div class="optlayout ${vr?'vr':'thumb'}">`;
  if(vr) h+=`<div class="vrstage"><iframe src="${VR_SRC}" allow="fullscreen; xr-spatial-tracking; accelerometer; gyroscope; magnetometer" allowfullscreen="true"></iframe>
    <div class="vrtag"><span class="dot"></span>VR 360 · ${S.type}</div></div>`;
  h+=`<div class="optcol">
    <h2 class="opttitle">옵션 선택</h2>
    <p class="optdesc">필요한 항목을 선택하면 화면과 하단 견적에 실시간 반영됩니다. 항목마다 하나씩 선택할 수 있습니다.</p>
    ${groups().map(groupHTML).join('')}
  </div></div>
  <div class="estbar"><div><div class="cnt">${selList().length}개 옵션 선택됨</div>
    <div class="amt">${won(total())}<small>원 · 총 옵션금액</small></div></div>
    <button class="cta" data-act="quote-open">견적서 확인 →</button></div>`;
  return h;
}

/* ===================== RENDER: HEADER & MODALS ===================== */
function headerHTML(){
  let h=`<div class="topbar">
    <img class="ci" src="assets/logo-thesharp-dark.png" alt="THE SHARP" onerror="logoFallback(this)" data-act="home" style="cursor:pointer">
    <span class="divider"></span>
    <span class="proj">더샵 송도그란테르</span><span class="projsub">옵션몰</span>
    <span class="spacer"></span>`;
  if(S.view==='options'&&S.unit){
    const nm=(S.unit.name&&S.unit.name!=='타입 미리보기')?S.unit.name:'김올림';
    h+=`<span class="unitchip"><b>${S.unit.block}구역</b><span>${S.type}</span><b>${nm}</b></span>
      <button class="back" data-act="back">← 변경</button>`;
  }
  h+=`<span class="phone"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>1600.0255</span></div>`;
  return h;
}
function modalsHTML(){
  let h='';
  if(S.quoteOpen){ const list=selList();
    h+=`<div class="ovl" data-act="quote-bg"><div class="modal">
      <div class="mh"><b>견적서</b><span class="x" data-act="quote-close">닫기 ✕</span></div>
      <div class="mc"><div class="qrow"><span>세대</span><b>${S.unit.block} ${S.unit.dong}·${S.unit.ho} · ${S.type}</b></div>`+
      (list.length?list.map(r=>`<div class="qrow"><span>${r.g} · ${r.label}</span><b>${won(r.v)} 원</b></div>`).join('')
        :`<div style="color:#9098A2;padding:16px 0;font-size:13px">선택된 유상옵션이 없습니다.</div>`)+
      `<div class="qnote">※ 납부: 계약금 10% / ${SETS[S.set].pay} 중도금 10% / 잔금 80%(입주지정일).<br>※ 가격은 입주자모집공고 기준 · 유상옵션 카탈로그 대조 필요(확인 필요).</div></div>
      <div class="mf"><b>총 옵션금액</b><b>${won(total())} 원</b></div></div></div>`;
  }
  if(S.guideOpen){ const vid=S.guideTab==='video';
    h+=`<div class="ovl" data-act="guide-bg"><div class="modal lg">
      <div style="padding:28px 30px 0"><h2 style="margin:0;font-size:25px;font-weight:800;color:#1B2430;letter-spacing:-.03em">옵션몰 사용 가이드</h2>
        <p style="margin:9px 0 0;font-size:14px;color:#727A86">아래 가이드를 확인 후 옵션 계약을 진행해주세요.</p></div>
      <div class="gtabs"><button data-act="guide-tab" data-tab="image" class="${!vid?'on':''}">이미지 가이드</button>
        <button data-act="guide-tab" data-tab="video" class="${vid?'on':''}">영상 가이드</button></div>
      <div style="padding:22px 30px 6px">`+
      (vid?`<div style="position:relative;border-radius:14px;overflow:hidden"><div class="imgslot" style="width:100%;aspect-ratio:16/9;background:#0E2233;color:rgba(255,255,255,.6)">가이드 영상 영역</div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none"><div style="width:62px;height:62px;border-radius:50%;background:rgba(216,38,38,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.35)"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"></path></svg></div></div></div>`
        :`<div class="imgslot" style="width:100%;aspect-ratio:16/10">가이드 이미지 1</div><div class="imgslot" style="width:100%;aspect-ratio:16/10;margin-top:12px">가이드 이미지 2</div>`)+
      `<div style="display:flex;align-items:center;gap:8px;margin-top:15px;color:#5B6675;font-size:12.5px">옵션 청약의 이해를 돕기 위한 자료입니다.</div></div>
      <div style="padding:10px 30px 28px"><button data-act="guide-close" style="width:100%;background:#1B2430;color:#fff;border:none;padding:17px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer">닫기</button></div>
    </div></div>`;
  }
  return h;
}

/* ===================== RENDER ===================== */
function render(){
  document.getElementById('header').innerHTML=headerHTML();
  document.getElementById('app').innerHTML = S.view==='landing'?landingHTML():optionsHTML();
  document.getElementById('modals').innerHTML=modalsHTML();
}
let _lt=0; function logoFallback(img){ _lt++; if(_lt===1){img.src='assets/logo-thesharp.png';} else { img.outerHTML='<span class="proj" style="font-family:Georgia,serif;font-variant:small-caps;letter-spacing:1px">The Sharp</span>'; } }
function planFallback(img){ img.outerHTML='<div class="imgslot" style="width:100%;aspect-ratio:4/3">평면도 이미지 영역 (assets/plan-sample.png)</div>'; }

/* ===================== EVENTS (delegated) ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='lookup'){ lookup(document.getElementById('codeInput').value); }
  else if(a==='demo'){ const v=el.dataset.code; const i=document.getElementById('codeInput'); if(i)i.value=v; lookup(v); }
  else if(a==='enter'){ openType(el.dataset.type,S.result.unit,S.result.code); }
  else if(a==='select'){ S.sel[el.dataset.group]=el.dataset.id; render(); }
  else if(a==='wide'){ S.fp.wide=!S.fp.wide; render(); }
  else if(a==='layout'){ S.layout=el.dataset.layout; render(); }
  else if(a==='quote-open'){ S.quoteOpen=true; render(); }
  else if(a==='quote-bg'){ if(e.target===el){ S.quoteOpen=false; render(); } }
  else if(a==='quote-close'){ S.quoteOpen=false; render(); }
  else if(a==='guide-open'){ S.guideOpen=true; render(); }
  else if(a==='guide-bg'){ if(e.target===el){ S.guideOpen=false; render(); } }
  else if(a==='guide-close'){ S.guideOpen=false; render(); }
  else if(a==='guide-tab'){ S.guideTab=el.dataset.tab; render(); }
  else if((a==='back'||a==='home') && S.view==='options'){ backToLanding(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='codeInput') lookup(e.target.value); });

render();
</script>
</body>
</html>
