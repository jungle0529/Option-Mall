function priceOf(it){ if(it.brand) return typeof it.price==='number'?it.price:0;
  if(it.p==='zero'||it.p==null) return 0; const m=it.p,f=S.fam;
  let v=(m[f]!=null?m[f]:(m.all!=null?m.all:0));

function jeonsilOn(){ const g=groupsOf().find(g=>g.id==='시스템에어컨'); if(!g)return false;
  const it=g.items.find(i=>i.id===S.sel[g.id]); return !!(it&&it.jeonsil); }
const enabled=g=>!(g.requireJeonsil&&!jeonsilOn());
function total(){ let t=0; for(const g of groupsOf()){ if(!enabled(g))continue; const it=g.items.find(i=>i.id===S.sel[g.id]); if(it)t+=priceOf(it);} return t; }

function itemShape(g,it){
  const sel=S.sel[g.id]===it.id, v=priceOf(it), zero=v<=0;
  return { label:it.label, desc:it.desc||'', isBase:it.id==='no'&&!g.brand,
    priceText: it.id==='no' ? (g.brand?'—':'포함') : '+'+won(v)+'원',
    priceFg: zero?'#9098A2':'#2B3340',
    bg: sel?'#EEF1F5':'#fff', bc: sel?'#2B3340':'#E2DED7',
    shadow: sel?'0 0 0 1px #2B3340':'0 1px 2px rgba(20,30,45,.04)',
    chkBg: sel?'#2B3340':'transparent', chkBc: sel?'#2B3340':'#C7CDD5', mark: sel?'✓':'',
    gid:g.id, iid:it.id };
}
function groupShape(g){
  const en=enabled(g);
  const selItem=g.items.find(i=>i.id===S.sel[g.id]);
  const pick=(selItem&&S.sel[g.id]!=='no'&&en)?selItem.label:null;
  const listItems=g.brand?[g.items[0]]:g.items;
  const wideOn=S.fp.wide;
  return { name:g.name, note:g.note||'', tag:g.brand?'브랜드 택1':'단일 선택', pick, locked:!en,
    isBrand:!!g.brand&&en,
    items: en?listItems.map(it=>itemShape(g,it)):[],
    brandItems: (g.brand&&en)?g.items.filter(i=>i.id!=='no').map(it=>{ const on=S.sel[g.id]===it.id;
      return {label:it.label,priceText:'+'+won(it.price)+'원',bg:on?'#EEF1F5':'#fff',bc:on?'#2B3340':'#E2DED7',gid:g.id,iid:it.id}; }):[],

    wideMark:wideOn?'✓':'', wideText:wideOn?'적용':'미적용', wideFg:wideOn?'#2B3340':'#9098A2',

}

      <span style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
        <span style="font-weight:800;font-size:15.5px;color:#1B2430">평면옵션 · 와이드리빙</span>
        <span style="font-weight:800;font-size:14px;color:${ag.wideFg}">${ag.wideText}</span></span>
      <span style="display:block;font-size:13px;color:#727A86;margin-top:6px;line-height:1.6">거실 확장형 평면. 선택 시 거실·조명·시스템에어컨 옵션의 구성·가격이 변경됩니다.</span>
    </span></div>`;
  h+=`<div style="display:flex;flex-direction:column;gap:11px">${ag.items.map(cardHTML).join('')}</div>`;
  if(ag.isBrand) h+=`<div style="display:flex;gap:11px;margin-top:11px">${ag.brandItems.map(b=>`<div data-act="sel" data-group="${b.gid}" data-id="${b.iid}" style="flex:1;border:1.5px solid ${b.bc};background:${b.bg};border-radius:4px;padding:16px;text-align:center;cursor:pointer"><div style="font-weight:800;font-size:15px;color:#1B2430">${b.label}</div><div style="font-weight:600;font-size:13px;color:#727A86;margin-top:4px">${b.priceText}</div></div>`).join('')}</div>`;
  return h;
}
function listHTML(){
  const gs=groupsOf(), gi=Math.min(S.activeTab||0,Math.max(gs.length-1,0));
  const ag=groupShape(gs[gi]);
  const tabs=gs.map((gg,i)=>{ const on=i===gi, done=S.sel[gg.id]&&S.sel[gg.id]!=='no'&&enabled(gg);
    return `<button data-act="tab" data-idx="${i}" style="position:relative;border:1px solid ${on?'#2B3340':'#E2DED7'};background:${on?'#2B3340':'#fff'};color:${on?'#fff':'#4A5462'};border-radius:999px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap">${gg.name}${done?'<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#7FE0A8;margin-left:8px;vertical-align:middle"></span>':''}</button>`;
  }).join('');
  const rows=selList();
  return `<div style="height:100vh;width:100%;background:#F7F5F1;display:flex;flex-direction:column;overflow:hidden">
  <div style="position:relative;display:flex;align-items:center;gap:24px;padding:14px 32px;background:#fff;border-bottom:1px solid #ECE9E3;flex:none">
    ${LOGO_TB('#0B2447')}
    <span style="width:1px;height:34px;background:#E2DED7"></span>
    <div style="display:flex;align-items:center;gap:14px;white-space:nowrap">
      <span style="font-size:clamp(20px,2.6vh,30px);font-weight:800;color:#1E2733;letter-spacing:-.02em">${BLOCK_OF[S.set]}</span>
      <span style="display:inline-flex;align-items:center;gap:10px;background:#EEF1F5;padding:8px 18px;border-radius:999px">
        <span style="font-size:clamp(11px,1.3vh,14px);color:#8C949F;font-weight:700;letter-spacing:.08em">TYPE</span>
        <span style="font-size:clamp(22px,2.8vh,32px);font-weight:800;color:#1B2430;letter-spacing:-.02em">${S.type}</span></span>
    </div>
    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;justify-content:center;gap:12px">
      <button data-act="gohome" style="border:1px solid #E2DED7;background:#fff;color:#3A424D;padding:14px 30px;border-radius:999px;cursor:pointer;font-size:clamp(16px,2vh,22px);font-weight:700;white-space:nowrap">홈</button>

    </div>

      <div style="font-size:14px;color:#727A86;margin-top:4px">카테고리를 선택해 옵션을 고르세요. 항목마다 하나씩 선택할 수 있습니다.</div></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;flex:none">${tabs}</div>
    <div style="flex:1;display:flex;gap:26px;min-height:0">
      <div style="flex:1.05;overflow-y:auto;min-width:0;padding-right:6px">${activeGroupHTML(ag)}</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #EBE7E1;border-radius:4px;padding:18px;min-height:0;position:relative;overflow:hidden">
        <img src="${ag.imgPath}" data-path="${ag.imgPath}" alt="옵션 이미지" onerror="optImgErr(this)" style="max-width:100%;max-height:100%;object-fit:contain;display:block">
      </div>
    </div>
  </div>
  <div style="position:fixed;left:0;right:0;bottom:0;background:#1B2430;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;z-index:40">
    <div><div style="font-size:12.5px;color:#9DAAB8">${rows.length}개 옵션 선택됨</div>
      <div style="font-size:27px;font-weight:800;letter-spacing:-.025em;margin-top:2px">${won(total())}<small style="font-size:13px;color:#9DAAB8;font-weight:500;margin-left:8px">원 · 총 옵션금액 (VAT 포함)</small></div></div>
    <button data-act="quoteopen" style="background:#fff;color:#1B2430;border:none;padding:16px 32px;border-radius:4px;font-weight:800;cursor:pointer;font-size:15px;white-space:nowrap">견적서 확인 →</button>
  </div>
</div>`;
}
function panelGroupHTML(g){
  const gs=groupShape(g);
  let h=`<div style="margin-bottom:28px"><div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px">
    <span style="font-size:16px;font-weight:800;color:#1B2430;letter-spacing:-.02em">${gs.name}</span>
    <span style="font-size:10.5px;font-weight:700;color:#2B3340;background:#EEF1F4;padding:3px 9px;border-radius:3px">${gs.tag}</span></div>`;
  if(gs.locked) h+=`<div style="font-size:12.5px;color:#9A6B2E;background:#FBF3E7;border:1px solid #F0E0C6;border-radius:4px;padding:13px 15px;line-height:1.55">시스템에어컨 고급형(전실) 선택 시 활성화됩니다.</div>`;
  h+=`<div style="display:flex;flex-direction:column;gap:8px">${gs.items.map(it=>`<div data-act="sel" data-group="${it.gid}" data-id="${it.iid}" style="display:flex;align-items:center;gap:12px;background:${it.bg};border:1.5px solid ${it.bc};border-radius:4px;padding:13px 15px;cursor:pointer">
      <span style="width:21px;height:21px;border-radius:4px;border:2px solid ${it.chkBc};background:${it.chkBg};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none">${it.mark}</span>
      <span style="flex:1;min-width:0;font-weight:700;font-size:14px;color:#1B2430">${it.label}</span>
      <span style="font-weight:800;font-size:13.5px;color:${it.priceFg};white-space:nowrap">${it.priceText}</span></div>`).join('')}</div>`;
  if(gs.isBrand) h+=`<div style="display:flex;gap:8px;margin-top:8px">${gs.brandItems.map(b=>`<div data-act="sel" data-group="${b.gid}" data-id="${b.iid}" style="flex:1;border:1.5px solid ${b.bc};background:${b.bg};border-radius:4px;padding:12px;text-align:center;cursor:pointer"><div style="font-weight:800;font-size:14px;color:#1B2430">${b.label}</div><div style="font-weight:600;font-size:12px;color:#727A86;margin-top:3px">${b.priceText}</div></div>`).join('')}</div>`;
  return h+`</div>`;
}
function vrHTML(){
  const open=S.panelOpen;
  const panelRight=open?'0px':'-460px', toggleRight=open?'440px':'0px', topRight=open?'440px':'0px', bottomRight=open?'472px':'32px', toggleLabel=open?'›':'‹';
  const rows=selList();
  return `<div style="position:fixed;inset:0;background:#0E2233;overflow:hidden">
  <iframe src="${VR_SRC}" allow="fullscreen; xr-spatial-tracking; accelerometer; gyroscope" allowfullscreen="true" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:block"></iframe>
  <div style="position:absolute;left:0;right:${topRight};top:0;z-index:12;display:flex;align-items:center;gap:20px;padding:16px 32px 34px;transition:right .22s;background:linear-gradient(180deg,rgba(8,22,40,.68),rgba(8,22,40,0))">
    <div style="filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))">${LOGO_TB('#fff')}</div>
    <span style="width:1px;height:34px;background:rgba(255,255,255,.3)"></span>
    <div style="display:flex;align-items:center;gap:14px;white-space:nowrap">
      <span style="font-size:clamp(18px,2.4vh,28px);font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)">${BLOCK_OF[S.set]}</span>
      <span style="display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.16);padding:8px 16px;border-radius:999px;backdrop-filter:blur(6px)">
        <span style="width:8px;height:8px;border-radius:50%;background:#7FE0A8;display:inline-block;animation:livedot 1.8s ease-in-out infinite"></span>
        <span style="font-size:clamp(11px,1.3vh,14px);font-weight:700;letter-spacing:.06em;color:#fff">VR LIVE</span>
        <span style="font-size:clamp(22px,2.8vh,32px);font-weight:800;color:#fff;letter-spacing:-.02em">${S.type}</span></span>
    </div>
    <div style="position:absolute;left:50%;top:26px;transform:translateX(-50%);display:flex;justify-content:center;gap:12px">
      <button data-act="gohome" style="border:none;background:rgba(255,255,255,.92);color:#2B3340;padding:14px 30px;border-radius:999px;cursor:pointer;font-size:clamp(16px,2vh,22px);font-weight:700;white-space:nowrap">홈</button>
      <button data-act="gotypes" style="border:none;background:#0B2447;color:#fff;padding:14px 38px;border-radius:999px;cursor:pointer;font-size:clamp(16px,2vh,22px);font-weight:700;white-space:nowrap">타입 선택</button>
    </div>
  </div>
  <button data-act="panel" style="position:absolute;top:50%;right:${toggleRight};transform:translateY(-50%);z-index:13;min-width:36px;height:82px;border:none;background:rgba(255,255,255,.94);border-radius:4px 0 0 4px;cursor:pointer;font-size:14px;font-weight:800;color:#2B3340;box-shadow:-4px 0 16px rgba(0,0,0,.25);padding:0 10px;transition:right .22s">${toggleLabel}</button>
  <aside style="position:absolute;top:0;right:${panelRight};width:440px;max-width:94vw;height:100%;background:#F7F5F1;z-index:12;display:flex;flex-direction:column;transition:right .22s;box-shadow:-14px 0 40px rgba(0,0,0,.32)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:24px 22px;background:#1B2430;color:#fff;flex:none;min-height:78px">
      <b style="font-size:17px;letter-spacing:-.02em">유상옵션 선택</b>
      <b style="font-size:17px;white-space:nowrap">${won(total())} 원</b>
    </div>
    <div style="flex:1;overflow-y:auto;padding:20px 22px">${groupsOf().map(panelGroupHTML).join('')}</div>
    <div style="border-top:1px solid #E2DED7;background:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none">
      <div><div style="font-size:11.5px;color:#727A86">${rows.length}개 옵션 선택됨</div>
        <div style="font-size:21px;font-weight:800;color:#1B2430;letter-spacing:-.02em">${won(total())}<small style="font-size:11.5px;color:#727A86;font-weight:500;margin-left:5px">원</small></div></div>
      <button data-act="quoteopen" style="background:#2B3340;color:#fff;border:none;padding:13px 20px;border-radius:4px;font-weight:800;cursor:pointer;white-space:nowrap;font-size:14px">견적서 확인 →</button>
    </div>
  </aside>
  <div style="position:absolute;bottom:20px;left:32px;right:${bottomRight};z-index:11;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;transition:right .22s;pointer-events:none">
    <div style="flex:1 1 auto;min-width:0;max-width:420px;font-size:11px;color:rgba(255,255,255,.72);line-height:1.6;text-shadow:0 1px 4px rgba(0,0,0,.6)">※ 본 VR은 향후 시공 후 마감재 색상·패턴·형태 등이 달라질 수 있습니다.<br>※ 자세한 사항은 계약 전 반드시 입주자 모집공고 및 분양 사무소에서 확인하시기 바랍니다.</div>
  </div>
</div>`;
}
function quoteHTML(){
  if(!S.quoteOpen) return '';
  const rows=selList();
  const body = rows.length
    ? rows.map(r=>`<div style="display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px dashed #EDEAE4;font-size:13.5px"><span style="color:#727A86">${r.g} · ${r.label}</span><b style="color:#1B2430">${r.v} 원</b></div>`).join('')
    : `<div style="color:#9098A2;padding:22px 0;font-size:13.5px">선택된 유상옵션이 없습니다.</div>`;
  return `<div data-act="quotebg" style="position:fixed;inset:0;background:rgba(12,20,32,.5);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="background:#fff;border-radius:6px;width:min(620px,94vw);box-shadow:0 30px 90px rgba(10,18,30,.45);overflow:hidden;animation:fadeup .18s ease-out">
    <div style="padding:22px 26px;border-bottom:1px solid #EDEAE4;display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:19px;color:#1B2430;letter-spacing:-.02em">유상옵션 견적서</b>
      <span data-act="quoteclose" style="cursor:pointer;color:#9098A2;font-size:13px;font-weight:600">닫기 ✕</span></div>
    <div style="padding:8px 26px;max-height:56vh;overflow:auto">
      <div style="display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px dashed #EDEAE4;font-size:13.5px"><span style="color:#727A86">세대 구분</span><b style="color:#1B2430">${BLOCK_OF[S.set]} · ${S.type}</b></div>
      ${body}
      <div style="font-size:11.5px;color:#9098A2;margin:18px 0;line-height:1.75">※ 납부: 계약금 10% / ${SETS[S.set].pay} 중도금 10% / 잔금 80%(입주지정일).<br>※ 가격은 입주자모집공고 기준이며 유상옵션 카탈로그와 대조가 필요합니다.</div>
    </div>
    <div style="padding:19px 26px;border-top:1px solid #EDEAE4;display:flex;justify-content:space-between;align-items:center;background:#FBFAF8">
      <b style="font-size:15px;color:#3A424D">총 옵션금액</b><b style="font-size:24px;color:#1B2430;letter-spacing:-.02em">${won(total())} 원</b></div>
  </div>
</div>`;
}

/* ===================== 렌더 & 이벤트 ===================== */
function render(){
  let h;
  if(S.view==='landing') h=landingHTML();
  else if(S.view==='types') h=typesHTML();
  else h=(S.mode==='vr')?vrHTML():listHTML();
  document.getElementById('app').innerHTML = h + quoteHTML();
}
function openType(t){ const T=TYPES[t]; Object.assign(S,{view:'options',type:t,set:T.set,fam:T.fam,mode:T.mode,sel:{},fp:{wide:false},activeTab:0,panelOpen:true,quoteOpen:false}); render(); }
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='pickA'){ S.blockGroup='a'; S.view='types'; render(); }
  else if(a==='pickB'){ S.blockGroup='b'; S.view='types'; render(); }
  else if(a==='gohome'){ S.view='landing'; render(); }
  else if(a==='gotypes'){ S.view=S.blockGroup?'types':'landing'; render(); }
  else if(a==='opentype'){ openType(el.dataset.type); }
  else if(a==='tab'){ S.activeTab=+el.dataset.idx; render(); }
  else if(a==='sel'){ S.sel={...S.sel,[el.dataset.group]:el.dataset.id}; render(); }
  else if(a==='wide'){ S.fp={...S.fp,wide:!S.fp.wide}; render(); }
  else if(a==='panel'){ S.panelOpen=!S.panelOpen; render(); }
  else if(a==='quoteopen'){ S.quoteOpen=true; render(); }
  else if(a==='quoteclose'){ S.quoteOpen=false; render(); }
  else if(a==='quotebg'){ if(e.target===el){ S.quoteOpen=false; render(); } }
});
render();
</script>
</body>
</html>
